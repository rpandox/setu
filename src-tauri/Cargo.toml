[package]
name = "setu"
version = "0.1.0"
description = "Setu — an open-source SSH command center for macOS"
authors = ["Roshan Pandey"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "setu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
