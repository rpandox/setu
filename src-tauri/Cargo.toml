[package]
name = "setu"
version = "0.1.0"
description = "Setu — an open-source SSH command center for macOS"
authors = ["Roshan Pandey"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "setu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dirs = "5"
# Reachability prober (F1, Phase 4): async TCP probes with timeouts on the
# runtime Tauri already embeds; `fastrand` supplies the probe-start jitter.
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util", "process"] }
fastrand = "2"
russh = "0.62.6"
russh-sftp = "2.4.0"
hmac = "0.12"
sha1 = "0.10"
tokio-util = "0.7"
tauri-plugin-dialog = "2.7.2"
libc = "0.2.189"
# Keychain doorway (F8, Phase 7): generic passwords under service
# dev.pandox.setu via Security.framework. Secrets never touch disk or logs.
keyring = { version = "3.6.3", features = ["apple-native"] }
# Vault export (F8, Phase 7): an age-encrypted tarball of the config dir —
# pure-Rust age (scrypt/passphrase recipient), no runtime binary needed (§5).
age = "0.10.1"
tar = "0.4"
# Git sync + snapshots (F10, Phase 8): secrets-lint regexes, gzip for the
# scheduled config-dir snapshots, the device hostname for commit messages,
# and UTC timestamp formatting (§5 snapshot-format row).
regex = "1"
flate2 = "1"
gethostname = "0.5"
time = { version = "0.3", features = ["formatting", "macros"] }
