[package]
name = "setu"
version = "0.1.0"
description = "Setu — an open-source SSH command center for macOS"
authors = ["Roshan Pandey"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "setu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dirs = "5"
# Reachability prober (F1, Phase 4): async TCP probes with timeouts on the
# runtime Tauri already embeds; `fastrand` supplies the probe-start jitter.
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util"] }
fastrand = "2"
russh = "0.62.6"
russh-sftp = "2.4.0"
hmac = "0.12"
sha1 = "0.10"
tokio-util = "0.7"
